<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Match - Volleyball Scorekeeper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Add New Match</h1>
      <a href="index.html" class="btn secondary">Back to Scoreboard</a>
    </header>

    <main class="card form-card">
      <form id="add-match-form">
        <!-- Division Selection -->
        <div class="form-group">
          <label for="division-select">Division</label>
          <select id="division-select">
            <option value="">Loading divisions...</option>
          </select>
        </div>

        <!-- Court Selection -->
        <div class="form-group">
          <label for="court-select">Court</label>
          <select id="court-select">
            <option value="">Loading courts...</option>
          </select>
        </div>

        <!-- Official Selection -->
        <div class="form-group">
          <label for="official-select">Official / Scorekeeper</label>
          <select id="official-select">
            <option value="">Loading officials...</option>
          </select>
        </div>

        <!-- Teams -->
        <div class="form-row">
          <div class="form-group">
            <label for="team-a">Home Team (Team A)</label>
            <input type="text" id="team-a" placeholder="e.g. School A" required />
          </div>
          <div class="form-group">
            <label for="team-b">Away Team (Team B)</label>
            <input type="text" id="team-b" placeholder="e.g. School B" required />
          </div>
        </div>

        <!-- Date / Time -->
        <div class="form-group">
          <label for="match-time">Match Date & Time</label>
          <input type="datetime-local" id="match-time" required />
        </div>

        <!-- Status -->
        <div class="form-group">
          <label for="match-status">Status</label>
          <select id="match-status">
            <option value="Scheduled">Scheduled</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <button type="submit" id="save-match-btn" class="btn primary">Create Match</button>
      </form>

      <div id="form-message" class="status-msg hidden"></div>
    </main>
  </div>

  <script type="module" src="add-match.js"></script>
</body>
</html>
