<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Scorekeeper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Volleyball Scorekeeper</h1>
      
      <!-- User Profile Header (Visible when logged in) -->
      <div id="user-profile" class="hidden">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn secondary">Logout</button>
      </div>
    </header>

    <!-- Email/Password Auth Form (Visible when logged out) -->
    <div id="auth-section" class="auth-card">
      <h2 id="auth-title">Sign In</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="coach@team.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="auth-submit-btn" class="btn primary">Sign In</button>
      </form>
      <div class="auth-toggle">
        <span id="auth-toggle-text">Need an account?</span>
        <button type="button" id="toggle-auth-mode" class="link-btn">Sign Up</button>
      </div>
      <div id="auth-error" class="error-msg hidden"></div>
    </div>

    <!-- Main Scoreboard (Hidden until authenticated) -->
    <div id="main-content" class="hidden">
      <div class="match-info">
        <span id="set-display">Set 1</span>
        <button id="reset-btn" class="btn secondary">Reset Game</button>
      </div>

      <main class="scoreboard">
        <!-- Team A Card -->
        <section class="team-card" id="team-a-card">
          <h2 id="team-a-name" contenteditable="true">Home Team</h2>
          <div class="score-display" id="score-a">0</div>
          <div class="sets-won">Sets Won: <span id="sets-a">0</span></div>
          <div class="controls">
            <button class="btn add-point" data-team="a">+1 Point</button>
            <button class="btn sub-point" data-team="a">-1 Point</button>
          </div>
        </section>

        <!-- Team B Card -->
        <section class="team-card" id="team-b-card">
          <h2 id="team-b-name" contenteditable="true">Away Team</h2>
          <div class="score-display" id="score-b">0</div>
          <div class="sets-won">Sets Won: <span id="sets-b">0</span></div>
          <div class="controls">
            <button class="btn add-point" data-team="b">+1 Point</button>
            <button class="btn sub-point" data-team="b">-1 Point</button>
          </div>
        </section>
      </main>

      <!-- Status Panel -->
      <section class="status-panel">
        <div id="db-status">Status: Connecting...</div>
        <div id="winner-banner" class="hidden"></div>
      </section>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
