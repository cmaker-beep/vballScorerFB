<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Scorekeeper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Volleyball Scorekeeper</h1>
      
      <!-- Profile display when authenticated -->
      <div id="user-profile" class="hidden">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn secondary">Logout</button>
      </div>
    </header>

    <!-- Authentication Card (Email/Password) -->
    <div id="auth-section" class="card auth-card">
      <h2 id="auth-title">Sign In</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="official@school.edu" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="auth-submit-btn" class="btn primary">Sign In</button>
      </form>
      <div class="auth-toggle">
        <span id="auth-toggle-text">Need an account?</span>
        <button type="button" id="toggle-auth-mode" class="link-btn">Sign Up</button>
      </div>
      <div id="auth-error" class="error-msg hidden"></div>
    </div>

    <!-- Main Scoreboard Workspace (Hidden until authenticated) -->
    <div id="main-content" class="hidden">
      
      <!-- Match Selection Dropdown & Metadata Bar -->
      <section class="card match-selector-card">
        <div class="form-group inline">
          <label for="match-select">Select Active Match:</label>
          <select id="match-select">
            <option value="">-- Choose a Match --</option>
          </select>
        </div>
        
        <div id="match-meta-details" class="meta-details hidden">
          <span class="badge" id="meta-division">Division: -</span>
          <span class="badge" id="meta-court">Court: -</span>
          <span class="badge" id="meta-official">Official: -</span>
          <span class="badge status-badge" id="meta-status">Status: -</span>
        </div>
      </section>

      <!-- Active Scoreboard Display -->
      <main id="scoreboard-view" class="scoreboard disabled">
        
        <!-- Team A -->
        <section class="team-card" id="team-a-card">
          <h2 id="team-a-name">Home Team</h2>
          <div class="score-display" id="score-a">0</div>
          <div class="controls">
            <button class="btn score-btn add-point" data-team="A" data-delta="1">+1 Point</button>
            <button class="btn score-btn sub-point" data-team="A" data-delta="-1">-1 Point</button>
          </div>
        </section>

        <!-- Divider / Set Info -->
        <div class="match-center-info">
          <div id="set-display">Match Scoring</div>
          <button id="reset-btn" class="btn warning">Reset Score</button>
        </div>

        <!-- Team B -->
        <section class="team-card" id="team-b-card">
          <h2 id="team-b-name">Away Team</h2>
          <div class="score-display" id="score-b">0</div>
          <div class="controls">
            <button class="btn score-btn add-point" data-team="B" data-delta="1">+1 Point</button>
            <button class="btn score-btn sub-point" data-team="B" data-delta="-1">-1 Point</button>
          </div>
        </section>
      </main>

      <!-- Sync Status Footer -->
      <footer class="status-panel">
        <div id="db-status">Database Status: Ready</div>
        <div id="last-updated">Last Updated: Never</div>
      </footer>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
